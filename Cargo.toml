[package]
name = "lorust"
version = "0.2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1.52.3", features = ["full"] }
isahc = { version = "2.0.0", default-features = false, features = ["http2", "static-curl", "native-tls-static", "text-decoding", "json", "cookies", "tls-insecure"] }
serde = { version = "1.0.228", features = ["default", "derive"] }
serde_json = { version = "1.0.150", features = ["std", "preserve_order"] }
form-data-builder = "1.0.1"
url_encoded_data = "0.6.1"
thiserror = "2.0.18"
async-recursion = "1.1.1"
futures = "0.3.32"
parking_lot = "0.12.5"
chrono = "0.4.44"
regex = "1.12.3"
clap = { version = "4.6.1", features = ["derive"] }
rustpython-vm = { version = "0.5.0", default-features = false, features = ["compiler", "gc", "serde", "stdio"] }
